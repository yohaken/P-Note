name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: mynote-f1bbc
  REGION: asia-southeast1
  SERVICE_NAME: p-note-api
  REPOSITORY: p-note

jobs:
  # Frontend can ship even when GCP_SA_KEY is broken — uses FIREBASE_TOKEN.
  deploy-hosting:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Deploying hosting via FIREBASE_TOKEN"
            npx firebase-tools@13 deploy --only hosting --project "${PROJECT_ID}" --non-interactive --token "$FIREBASE_TOKEN"
            exit 0
          fi

          # Fallback: Application Default Credentials from service-account JSON
          if [ -z "${GCP_SA_KEY:-}" ]; then
            echo "::error::Neither FIREBASE_TOKEN nor GCP_SA_KEY is set"
            exit 1
          fi
          # Detect obvious corruption before calling auth tooling
          head=$(printf '%s' "$GCP_SA_KEY" | head -c 1)
          if [ "$head" != '{' ] && [ "$head" != 'e' ] && [ "$head" != 'E' ]; then
            echo "::error::GCP_SA_KEY does not look like JSON or base64 JSON (starts with unexpected byte). Re-set the secret with the full service-account key file."
            exit 1
          fi
          printf '%s' "$GCP_SA_KEY" > "${RUNNER_TEMP}/gcp-sa.json"
          # If base64, decode
          if ! jq -e . "${RUNNER_TEMP}/gcp-sa.json" >/dev/null 2>&1; then
            if printf '%s' "$GCP_SA_KEY" | base64 -d > "${RUNNER_TEMP}/gcp-sa.decoded" 2>/dev/null \
              && jq -e . "${RUNNER_TEMP}/gcp-sa.decoded" >/dev/null 2>&1; then
              mv "${RUNNER_TEMP}/gcp-sa.decoded" "${RUNNER_TEMP}/gcp-sa.json"
            else
              echo "::error::GCP_SA_KEY is not valid JSON (and not base64 JSON). Re-set with: gh secret set GCP_SA_KEY < pnote-gcp-sa-key.json"
              exit 1
            fi
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/gcp-sa.json"
          npx firebase-tools@13 deploy --only hosting,firestore:rules --project "${PROJECT_ID}" --non-interactive

  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable required Google APIs
        run: |
          gcloud services enable \
            artifactregistry.googleapis.com \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            firestore.googleapis.com \
            storage.googleapis.com \
            firebase.googleapis.com \
            firebasehosting.googleapis.com \
            iam.googleapis.com \
            --project=${{ env.PROJECT_ID }} \
            --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} \
            --project=${{ env.PROJECT_ID }} \
            --location=${{ env.REGION }} 2>/dev/null || \
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --project=${{ env.PROJECT_ID }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --description="P-Note Docker images" \
            --quiet

      - name: Ensure Firestore database (Native mode)
        run: |
          gcloud services enable firestore.googleapis.com --project ${{ env.PROJECT_ID }} || true
          gcloud firestore databases describe --project ${{ env.PROJECT_ID }} 2>/dev/null || \
          gcloud firestore databases create \
            --project ${{ env.PROJECT_ID }} \
            --location=${{ env.REGION }} \
            --type=firestore-native || true

      - name: Ensure Cloud Storage bucket for note files
        run: |
          gcloud services enable storage.googleapis.com --project ${{ env.PROJECT_ID }} || true
          BUCKET="${{ env.PROJECT_ID }}-pnote-files"
          if ! gcloud storage buckets describe "gs://${BUCKET}" --project ${{ env.PROJECT_ID }} >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${BUCKET}" \
              --project=${{ env.PROJECT_ID }} \
              --location=${{ env.REGION }} \
              --uniform-bucket-level-access
          fi
          gcloud storage buckets update "gs://${BUCKET}" --cors-file=backend/gcs-cors.json || true
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format='value(projectNumber)')
          RUNTIME_SA="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          gcloud storage buckets add-iam-policy-binding "gs://${BUCKET}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/storage.objectAdmin" || true
          gcloud iam service-accounts add-iam-policy-binding "${RUNTIME_SA}" \
            --member="serviceAccount:${RUNTIME_SA}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --project=${{ env.PROJECT_ID }} || true
          echo "FILES_BUCKET=${BUCKET}" >> $GITHUB_ENV

      - name: Build and push backend image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --max-instances=1 \
            --min-instances=0 \
            --memory=512Mi \
            --set-env-vars="ALLOWED_EMAIL=phiraphong.yoh@gmail.com,GCP_PROJECT_ID=${{ env.PROJECT_ID }},FILES_BUCKET=${{ env.PROJECT_ID }}-pnote-files"

      - name: Get Cloud Run URL
        id: run-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Cloud Run URL: $URL"

      - name: Fix Google Auth IdP (redirect_uri_mismatch)
        continue-on-error: true
        run: |
          npm install google-auth-library@9 --no-save
          node scripts/fix-google-idp.mjs

      - name: Deployment summary
        run: |
          echo "## Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "- App: https://${{ env.PROJECT_ID }}.web.app (Auth + Firestore direct)" >> $GITHUB_STEP_SUMMARY
          echo "- API (files only): ${{ steps.run-url.outputs.url }}/api/health" >> $GITHUB_STEP_SUMMARY
