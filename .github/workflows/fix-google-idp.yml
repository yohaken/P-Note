name: Fix Google Auth IdP

on:
  workflow_dispatch:

env:
  PROJECT_ID: mynote-f1bbc

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps + run fix
        run: |
          npm install google-auth-library@9 --no-save
          node scripts/fix-google-idp.mjs
